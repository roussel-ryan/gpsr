[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=75.0",
  "setuptools_scm[toml]>=8.0"
]

[project]
authors = [
  {name="Ryan Roussel"},
  {name="Juan Pablo Gonzalez Aguilera"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "lightning>=2,<=2.6.1",
  "matplotlib>=3.3.0",
  "cheetah-accelerator>=0.8.0",
  "tensorboard",
  "scipy",
  "scikit-image",
  "zuko==1.4.0",
]
description = "Phase space reconstruction using differentiable beam dynamics and generative beam representations"
dynamic = [ "version" ]
keywords = []
name = "gpsr"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "jupyter",
  "pre-commit"
]
# The gpsr.lume subpackage only. Kept out of the core dependencies so that
# `import gpsr` never requires a virtual-accelerator stack. Note lume-cheetah
# requires Python >=3.11, so this extra does not resolve on 3.10.
lume = [
  "lume-cheetah>=0.1.0",
  "tensordict",
]
doc = [
  "mkdocs",
  "mkdocs-jupyter",
  "mkdocs-macros-plugin",
  "mkdocs-material",
  "mkdocstrings",
  "mkdocstrings-python",
]

[project.urls]
Homepage = "https://github.com/roussel-ryan/gpsr"

[options]
zip_safe = false
include_package_data = true

[tool.setuptools.packages.find]
where = ["."]
# These patterns are fnmatched against the full dotted package name, so "gpsr" alone
# matches only the top-level package: a subpackage needs its own entry or it is
# silently left out of the wheel while editable installs keep working. Spelled out
# rather than "gpsr*" so that shipping a new package stays a deliberate act.
include = [ "gpsr", "gpsr.lume*", ]
namespaces = false

[project.license]
file = "LICENSE"

[tool.ruff]
# select = []
# ignore = []

[tool.pytest.ini_options]
log_cli_level = "info"
testpaths = ["gpsr/tests"]

[tool.setuptools_scm]
version_file = "gpsr/_version.py"

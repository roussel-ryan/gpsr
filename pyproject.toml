[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=75.0",
  "setuptools_scm[toml]>=8.0"
]

[project]
authors = [
  {name="Ryan Roussel"},
  {name="Juan Pablo Gonzalez Aguilera"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "lightning>=2",
  "matplotlib>=3.3.0",
  "cheetah-accelerator>=0.8.0",
  "tensorboard",
  "scipy",
  "scikit-image",
  "zuko==1.4.0",
]
description = "Phase space reconstruction using differentiable beam dynamics and generative beam representations"
dynamic = [ "version" ]
keywords = []
name = "gpsr"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "jupyter",
  "pre-commit"
]
lume = [
  "lume-cheetah>=0.1.0",
  "tensordict",
]
doc = [
  "mkdocs",
  "mkdocs-jupyter",
  "mkdocs-macros-plugin",
  "mkdocs-material",
  "mkdocstrings",
  "mkdocstrings-python",
]

[project.urls]
Homepage = "https://github.com/roussel-ryan/gpsr"

[options]
zip_safe = false
include_package_data = true

[tool.setuptools.packages.find]
where = ["."]
# These patterns are fnmatched against the full dotted package name, so "gpsr" alone
# matches only the top-level package: a subpackage needs its own entry or it is
# silently left out of the wheel while editable installs keep working. Spelled out
# rather than "gpsr*" so that shipping a new package stays a deliberate act.
include = [ "gpsr", "gpsr.lume*", ]
namespaces = false

[project.license]
file = "LICENSE"

[tool.ruff]
# select = []
# ignore = []

[tool.ruff.lint]
# E402 is on by default in the pinned ruff (see .pre-commit-config.yaml) but not in
# newer ones, so select it explicitly: otherwise a newer local ruff passes a file
# that CI rejects.
extend-select = ["E402"]

[tool.ruff.lint.per-file-ignores]
# The lume tests skip themselves when the optional lume dependencies are missing,
# using `pytest.importorskip` at module level. Those guards have to run before the
# imports they protect, so the imports cannot sit at the top of the file.
"gpsr/tests/test_lume_*.py" = ["E402"]

[tool.pytest.ini_options]
log_cli_level = "info"
testpaths = ["gpsr/tests"]

[tool.setuptools_scm]
version_file = "gpsr/_version.py"
